const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function cands(pw){const o=[pw],add=x=>{if(x&&!o.includes(x))o.push(x)};
const dg=x=>x.split('').map(c=>{const n=c.charCodeAt(0);return n>=1632&&n<=1641?String(n-1632):n>=1776&&n<=1785?String(n-1776):c}).join('');
const lw=x=>x.charAt(0).toLowerCase()+x.slice(1),up=x=>x.charAt(0).toUpperCase()+x.slice(1);
[pw,pw.trim()].forEach(a=>{[a,a.normalize('NFC'),a.normalize('NFKC')].forEach(c=>{[c,dg(c)].forEach(d=>{add(d);add(lw(d));add(up(d))})})});
add(pw.replace(/s+/g,''));return o.slice(0,40)}
async function unlock1(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.v)},key,b(D.c)))}
async function unlock(pw){if(!(window.crypto&&crypto.subtle))throw new Error('NOCRYPTO');let bad;
for(const c of cands(pw)){try{return await unlock1(c)}catch(x){bad=x}}throw bad}

const f=document.getElementById('f'),p=document.getElementById('p'),r=document.getElementById('r'),e=document.getElementById('e'),btn=f.querySelector('button');
async function attempt(pw,auto){btn.disabled=true;e.textContent=auto?'':'جارٍ الفتح...';
try{const h=await unlock(pw);if(r.checked&&!auto)try{localStorage.setItem('wlt_lock',pw)}catch(_){}show(h)}
catch(x){btn.disabled=false;e.textContent=auto?'':(x&&x.message==='NOCRYPTO'?'المتصفح لا يدعم الفتح هنا: افتح الرابط عبر https وبمتصفح حديث (Chrome)':(x&&x.name==='InvalidCharacterError'?'الملف تالف أو لم يُرفع كاملاً، أعد رفعه':'كلمة المرور غير صحيحة'));if(auto)try{localStorage.removeItem('wlt_lock')}catch(_){}}}
